name: Bug Report
description: Something is broken or not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.  
        Please fill every required field — incomplete reports will be closed.

  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      description: Exact version from the jar name or mods menu
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      description: Should normally be 26.2
      placeholder: "26.2"
    validations:
      required: true

  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge Version
      placeholder: "e.g. 26.2.x"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - Multiplayer (server)
        - Both
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: "Clear and concise description of the bug"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: "What should have happened instead?"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered list
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other Mods
      description: List other mods (especially ones that might conflict). Or say "none".
      placeholder: "Just Enough Items, Create, etc. / none"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash Report
      description: |
        Paste the relevant part of `latest.log` or the full crash report.
        Upload the full log as a .txt/.log file if it's long.
      render: shell
      placeholder: "Paste logs here..."
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, config changes, anything else useful
      placeholder: "Any extra information..."
